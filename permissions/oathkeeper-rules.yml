# Oathkeeper access rules for the MCM API: the route-to-permission contract
# against the OPL model in mcm.keto.ts. Deployments render the placeholders:
#   ${MCM_FQDN}         public host of the API
#   ${KETO_READ_URL}    Keto read endpoint (permission checks)
#   ${KETO_HUB_OBJECT}  Hub object id in the permission model

# DFSP list: any authenticated caller; the API scopes rows by X-Roles
- id: mcm-api-dfsps-list
  match:
    url: "<http|https>://${MCM_FQDN}/api/dfsps<$>"
    methods: [GET]
  authenticators:
    - handler: cookie_session
    - handler: jwt
  authorizer:
    handler: allow
  mutators:
    - handler: header

# DFSP create: Hub.dfspManage
- id: mcm-api-dfsps-create
  match:
    url: "<http|https>://${MCM_FQDN}/api/dfsps<$>"
    methods: [POST]
  authenticators:
    - handler: cookie_session
    - handler: jwt
  authorizer:
    handler: remote_json
    config:
      remote: ${KETO_READ_URL}/relation-tuples/check
      payload: |
        {
          "namespace": "Hub",
          "object": "${KETO_HUB_OBJECT}",
          "relation": "dfspManage",
          "subject_id": "{{ print .Subject }}"
        }
  mutators:
    - handler: header

# All DFSPs states overview: Hub.dfspList
- id: mcm-api-dfsps-states-status
  match:
    url: "<http|https>://${MCM_FQDN}/api/dfsps/states-status<$>"
    methods: [GET]
