        }
  mutators:
    - handler: header

# Single DFSP read/update: Dfsp.view (member or hub admin)
- id: mcm-api-dfsp-view
  match:
    url: "<http|https>://${MCM_FQDN}/api/dfsps/<?!jwscerts|servercerts|states-status|endpoints><[^/]+><$>"
    methods: [GET, PUT]
  authenticators:
    - handler: cookie_session
    - handler: jwt
  authorizer:
    handler: remote_json
    config:
      remote: ${KETO_READ_URL}/relation-tuples/check
      payload: |
        {
          "namespace": "Dfsp",
          "object": "{{ printIndex .MatchContext.RegexpCaptureGroups 1 }}",
          "relation": "view",
          "subject_id": "{{ print .Subject }}"
        }
  mutators:
    - handler: header

