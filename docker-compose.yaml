x-api-env: &api-env
  - IAM_ENABLED=true
  - IAM_AUTO_CREATE_ACCOUNTS=true
  - HYDRA_PUBLIC_URL=http://hydra.${COMPOSE_DOMAIN:-mcm.localhost}
  - HYDRA_ADMIN_URL=http://hydra-admin.${COMPOSE_DOMAIN:-mcm.localhost}
  - HYDRA_AUDIENCE=connection-manager-api
  - KRATOS_PUBLIC_URL=http://kratos.${COMPOSE_DOMAIN:-mcm.localhost}
  - KRATOS_ADMIN_URL=http://kratos-admin.${COMPOSE_DOMAIN:-mcm.localhost}
  - KRATOS_IDENTITY_SCHEMA_ID=default
  - KRATOS_INVITE_RETURN_TO_URL=http://${COMPOSE_DOMAIN:-mcm.localhost}/
  - KETO_READ_URL=http://keto-read.${COMPOSE_DOMAIN:-mcm.localhost}
  - KETO_WRITE_URL=http://keto-write.${COMPOSE_DOMAIN:-mcm.localhost}
  - CLIENT_URL=http://${COMPOSE_DOMAIN:-mcm.localhost}

x-api-labels: &api-labels
  - "traefik.http.routers.mcm-api.rule=Host(`${COMPOSE_DOMAIN:-mcm.localhost}`) && PathPrefix(`/api`)"
  - "traefik.http.services.mcm-api.loadbalancer.server.port=3001"
  - "traefik.http.routers.mcm-api.middlewares=oathkeeper-auth"

x-api-healthcheck: &api-healthcheck
  test: wget --spider --quiet http://localhost:3001/api/health
  interval: 5s
  timeout: 3s
  retries: 3
  start_period: 5s

volumes:
  vault-data: {}
  vault-creds: {}
  mailpit-data: {}
  ory-config: {}
  hydra-sqlite: {}
  kratos-sqlite: {}
  keto-sqlite: {}

services:

  traefik:
    image: traefik
    command:
      - --entrypoints.web.address=:80
      - --providers.docker=true
      - --api.dashboard=true
      - --api.insecure=true
    ports:
      - "${TRAEFIK_HTTP_PORT:-80}:80"
      - "${TRAEFIK_DASHBOARD_PORT:-8090}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      default:
        aliases:
          - ${COMPOSE_DOMAIN:-mcm.localhost}
          - vault.${COMPOSE_DOMAIN:-mcm.localhost}
          - mailpit.${COMPOSE_DOMAIN:-mcm.localhost}
          - hydra.${COMPOSE_DOMAIN:-mcm.localhost}
          - hydra-admin.${COMPOSE_DOMAIN:-mcm.localhost}
          - kratos.${COMPOSE_DOMAIN:-mcm.localhost}
          - kratos-admin.${COMPOSE_DOMAIN:-mcm.localhost}
          - keto-read.${COMPOSE_DOMAIN:-mcm.localhost}
          - keto-write.${COMPOSE_DOMAIN:-mcm.localhost}
          - auth.${COMPOSE_DOMAIN:-mcm.localhost}
    restart: always

  connection-manager-ui:
    image: mojaloop/connection-manager-ui
    hostname: connection-manager-ui
    profiles:
      - dev
      - full
    environment:
      - AUTH_ENABLED=TRUE
      - API_BASE_URL=http://${COMPOSE_DOMAIN:-mcm.localhost}
      - LOGIN_URL=http://kratos.${COMPOSE_DOMAIN:-mcm.localhost}/self-service/login/browser
      - LOGOUT_URL=http://kratos.${COMPOSE_DOMAIN:-mcm.localhost}/self-service/logout/browser
      - CHECK_SESSION_URL=http://kratos.${COMPOSE_DOMAIN:-mcm.localhost}/sessions/whoami
    labels:
      - "traefik.http.routers.mcm-ui.rule=Host(`${COMPOSE_DOMAIN:-mcm.localhost}`) && !PathPrefix(`/api`)"
      - "traefik.http.services.mcm-ui.loadbalancer.server.port=8080"
    tty: true
    stdin_open: true
    restart: always

  connection-manager-migration:
    image: mojaloop/connection-manager-api:local
    pull_policy: if_not_present
    build:
      context: .
      dockerfile: Dockerfile
    profiles:
      - ci
    env_file:
      - ./docker/migration.env
    depends_on:
      connection-manager-db:
        condition: service_healthy
      vault-init:
        condition: service_completed_successfully
    volumes:
      - vault-creds:/vault
    command: npm run migrate
    restart: "no"

  connection-manager-migration-full:
    image: mojaloop/connection-manager-api
    pull_policy: if_not_present
    build:
      context: .
      dockerfile: Dockerfile
    profiles:
      - full
    env_file:
      - ./docker/migration.env
    depends_on:
      connection-manager-db:
        condition: service_healthy
      vault-init:
        condition: service_completed_successfully
    volumes:
      - vault-creds:/vault
    command: npm run migrate
    restart: "no"

  connection-manager-api-proxy:
    image: alpine/socat
    command: tcp-listen:${PORT:-3001},fork,reuseaddr tcp-connect:host.docker.internal:${PORT:-3001}
    profiles:
      - dev
    extra_hosts:
      - "host.docker.internal:host-gateway"
    labels:
      - "traefik.http.routers.mcm-api.rule=Host(`${COMPOSE_DOMAIN:-mcm.localhost}`) && PathPrefix(`/api`)"
      - "traefik.http.services.mcm-api.loadbalancer.server.port=${PORT:-3001}"
      - "traefik.http.routers.mcm-api.middlewares=oathkeeper-auth"

  connection-manager-api:
    image: mojaloop/connection-manager-api:local
    pull_policy: if_not_present
    build:
      context: .
      dockerfile: Dockerfile
    profiles:
      - ci
    env_file:
      - ./docker/api.env
    environment: *api-env
    labels: *api-labels
    volumes:
      - vault-creds:/vault
      - ./docker/mcm/resources:/resources:ro
    tty: true
    stdin_open: true
    restart: always
    depends_on:
      vault-init:
        condition: service_completed_successfully
      hydra:
        condition: service_healthy
      kratos:
        condition: service_healthy
      keto:
        condition: service_healthy
      iam-bootstrap:
        condition: service_completed_successfully
      connection-manager-migration:
        condition: service_completed_successfully
    healthcheck: *api-healthcheck

  connection-manager-api-full:
    image: mojaloop/connection-manager-api
    pull_policy: if_not_present
    build:
      context: .
      dockerfile: Dockerfile
    profiles:
      - full
    env_file:
      - ./docker/api.env
    environment: *api-env
    labels: *api-labels
    volumes:
      - vault-creds:/vault
      - ./docker/mcm/resources:/resources:ro
    tty: true
    stdin_open: true
    restart: always
    depends_on:
      vault-init:
        condition: service_completed_successfully
      hydra:
        condition: service_healthy
      kratos:
        condition: service_healthy
      keto:
        condition: service_healthy
      iam-bootstrap:
        condition: service_completed_successfully
      connection-manager-migration-full:
        condition: service_completed_successfully
    healthcheck: *api-healthcheck

  connection-manager-db:
    image: mysql:9
    ports:
      - "${DATABASE_PORT:-3306}:3306"
    volumes:
      - ./docker/sql-init/:/docker-entrypoint-initdb.d/
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-modus123}
      - MYSQL_USER=${DBUSER:-mcm}
      - MYSQL_PASSWORD=${DBPASS:-mcm}
      - MYSQL_DATABASE=${DBUSER:-mcm}
    healthcheck:
      test: ["CMD-SHELL", "mysql -h localhost -u$$MYSQL_USER -p$$MYSQL_PASSWORD -e 'SELECT 1'"]
      interval: 5s
      timeout: 3s
      retries: 20

  vault:
    image: hashicorp/vault:1.21
    command: server
    restart: always
    tty: true
    stdin_open: true
    environment:
      VAULT_ADDR: http://127.0.0.1:8233
      VAULT_API_ADDR: http://0.0.0.0:8233
      VAULT_LOCAL_CONFIG: '{"listener": [{"tcp": {"address": "0.0.0.0:8233", "tls_disable": true}}], "storage": {"file": {"path": "/vault/data"}}, "default_lease_ttl": "8760h", "max_lease_ttl": "87600h", "ui": true}'
    labels:
      - "traefik.http.routers.vault.rule=Host(`vault.${COMPOSE_DOMAIN:-mcm.localhost}`)"
      - "traefik.http.services.vault.loadbalancer.server.port=8233"
    volumes:
      - vault-data:/vault/data
      - vault-creds:/vault/creds
      - ./docker/vault/docker-entrypoint.sh:/usr/local/bin/docker-entrypoint.sh
    cap_add:
      - IPC_LOCK
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:8233/v1/sys/health?sealedcode=200&uninitcode=200"]
      interval: 3s
      timeout: 2s
      retries: 10
      start_period: 3s

  vault-init:
    build:
      context: ./docker/vault
      dockerfile_inline: |
        FROM alpine:latest
        RUN apk add --no-cache curl jq
    environment:
      VAULT_ADDR: http://vault:8233
    volumes:
      - vault-data:/vault/data
      - vault-creds:/vault/creds
      - ./docker/vault/vault-init.sh:/vault-init.sh
    depends_on:
      vault:
        condition: service_healthy
    entrypoint: /vault-init.sh
    restart: "no"

  volume_explorer:
    image: alpine
    command: sh -c 'cp -r /vault/creds/. /creds/ && tail -f /dev/null'
    volumes:
      - vault-creds:/vault/creds:ro
      - ./docker/vault/tmp:/creds:rw
    depends_on:
      vault-init:
        condition: service_completed_successfully
    restart: "no"
    profiles:
      - dev
      - ci

  mailpit:
    image: axllent/mailpit:latest
    labels:
      - "traefik.http.routers.mailpit.rule=Host(`mailpit.${COMPOSE_DOMAIN:-mcm.localhost}`)"
      - "traefik.http.services.mailpit.loadbalancer.server.port=8025"
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:8025/api/v1/info"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # Hydra mounts a named volume at /var/lib/sqlite but runs as a non-root user
  # and the image doesn't pre-create the dir, so busybox makes it writable.
  # Renders the Ory config templates, substituting ${COMPOSE_DOMAIN}, into the
  # ory-config volume that the Ory services mount.
  prepare-ory-config:
    image: alpine
    environment:
      - COMPOSE_DOMAIN=${COMPOSE_DOMAIN:-mcm.localhost}
      - MCM_FQDN=${COMPOSE_DOMAIN:-mcm.localhost}
      - KETO_READ_URL=http://keto:4466
      - KETO_HUB_OBJECT=${KETO_HUB_OBJECT:-mojaloop}
    volumes:
      - ./docker/ory:/templates:ro
      - ./permissions:/permissions:ro
      - ory-config:/rendered
    entrypoint: ["/bin/sh", "/templates/render-config.sh"]
    restart: "no"

  hydra-sqlite-init:
    image: busybox
    command: chmod -R 777 /var/lib/sqlite
    volumes:
      - hydra-sqlite:/var/lib/sqlite
    restart: "no"

  hydra-migrate:
    image: oryd/hydra:v26.2.0
    environment:
      - DSN=sqlite:///var/lib/sqlite/db.sqlite?_fk=true&mode=rwc
    volumes:
      - hydra-sqlite:/var/lib/sqlite
      - ory-config:/etc/config:ro
    command: migrate sql --yes --config /etc/config/hydra/hydra.yml -e
    depends_on:
      hydra-sqlite-init:
        condition: service_completed_successfully
      prepare-ory-config:
        condition: service_completed_successfully
    restart: "no"

  hydra:
    image: oryd/hydra:v26.2.0
    command: serve all --dev --config /etc/config/hydra/hydra.yml
    environment:
      - DSN=sqlite:///var/lib/sqlite/db.sqlite?_fk=true&mode=rwc
    volumes:
      - hydra-sqlite:/var/lib/sqlite
      - ory-config:/etc/config:ro
    labels:
      - "traefik.http.routers.hydra.rule=Host(`hydra.${COMPOSE_DOMAIN:-mcm.localhost}`)"
      - "traefik.http.routers.hydra.service=hydra"
      - "traefik.http.services.hydra.loadbalancer.server.port=4444"
      - "traefik.http.routers.hydra-admin.rule=Host(`hydra-admin.${COMPOSE_DOMAIN:-mcm.localhost}`)"
      - "traefik.http.routers.hydra-admin.service=hydra-admin"
      - "traefik.http.services.hydra-admin.loadbalancer.server.port=4445"
    depends_on:
      hydra-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:4444/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  kratos-migrate:
    image: oryd/kratos:v26.2.0
    environment:
      - DSN=sqlite:///var/lib/sqlite/db.sqlite?_fk=true&mode=rwc
    volumes:
      - kratos-sqlite:/var/lib/sqlite
      - ory-config:/etc/config:ro
    command: migrate sql --yes --config /etc/config/kratos/kratos.yml -e
    depends_on:
      prepare-ory-config:
        condition: service_completed_successfully
    restart: "no"

  kratos:
    image: oryd/kratos:v26.2.0
    command: serve --dev --watch-courier --config /etc/config/kratos/kratos.yml
    environment:
      - DSN=sqlite:///var/lib/sqlite/db.sqlite?_fk=true&mode=rwc
    volumes:
      - kratos-sqlite:/var/lib/sqlite
      - ory-config:/etc/config:ro
    labels:
      - "traefik.http.routers.kratos.rule=Host(`kratos.${COMPOSE_DOMAIN:-mcm.localhost}`)"
      - "traefik.http.routers.kratos.service=kratos"
      - "traefik.http.services.kratos.loadbalancer.server.port=4433"
      - "traefik.http.routers.kratos-admin.rule=Host(`kratos-admin.${COMPOSE_DOMAIN:-mcm.localhost}`)"
      - "traefik.http.routers.kratos-admin.service=kratos-admin"
      - "traefik.http.services.kratos-admin.loadbalancer.server.port=4434"
    depends_on:
      kratos-migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:4433/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  kratos-ui:
    image: oryd/kratos-selfservice-ui-node:v26.2.0
    profiles:
      - dev
      - full
    environment:
      - PORT=3000
      - KRATOS_PUBLIC_URL=http://kratos:4433
      - KRATOS_BROWSER_URL=http://kratos.${COMPOSE_DOMAIN:-mcm.localhost}
      - COOKIE_SECRET=changeme-please-changeme-please
      - CSRF_COOKIE_NAME=mcm_csrf_token
      - CSRF_COOKIE_SECRET=changeme-please-changeme-please
      - DANGEROUSLY_DISABLE_SECURE_CSRF_COOKIES=true
      - BASE_URL=http://auth.${COMPOSE_DOMAIN:-mcm.localhost}/
    labels:
      - "traefik.http.routers.kratos-ui.rule=Host(`auth.${COMPOSE_DOMAIN:-mcm.localhost}`)"
      - "traefik.http.services.kratos-ui.loadbalancer.server.port=3000"
    depends_on:
      kratos:
        condition: service_healthy
    restart: unless-stopped

  keto-sqlite-init:
    image: busybox
    command: chmod -R 777 /var/lib/sqlite
    volumes:
      - keto-sqlite:/var/lib/sqlite
    restart: "no"

  keto-migrate:
    image: oryd/keto:v26.2.0
    environment:
      - DSN=sqlite:///var/lib/sqlite/db.sqlite?_fk=true&mode=rwc
    volumes:
      - keto-sqlite:/var/lib/sqlite
      - ory-config:/etc/config:ro
      - ./permissions/mcm.keto.ts:/etc/keto-namespaces/mcm.keto.ts:ro
    command: migrate up -y --config /etc/config/keto/keto.yml
    depends_on:
      keto-sqlite-init:
        condition: service_completed_successfully
      prepare-ory-config:
        condition: service_completed_successfully
    restart: "no"

  keto:
    image: oryd/keto:v26.2.0
    command: serve --config /etc/config/keto/keto.yml
    environment:
      - DSN=sqlite:///var/lib/sqlite/db.sqlite?_fk=true&mode=rwc
    volumes:
      - keto-sqlite:/var/lib/sqlite
      - ory-config:/etc/config:ro
      - ./permissions/mcm.keto.ts:/etc/keto-namespaces/mcm.keto.ts:ro
    labels:
      - "traefik.http.routers.keto-read.rule=Host(`keto-read.${COMPOSE_DOMAIN:-mcm.localhost}`)"
      - "traefik.http.routers.keto-read.service=keto-read"
      - "traefik.http.services.keto-read.loadbalancer.server.port=4466"
      - "traefik.http.routers.keto-write.rule=Host(`keto-write.${COMPOSE_DOMAIN:-mcm.localhost}`)"
      - "traefik.http.routers.keto-write.service=keto-write"
      - "traefik.http.services.keto-write.loadbalancer.server.port=4467"
    depends_on:
      keto-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:4466/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  # Zero-trust gateway: Traefik consults Oathkeeper (forward-auth) for every
  # /api request. Oathkeeper validates the Kratos session or Hydra JWT and
  # returns the X-User/X-Email/X-DFSP-ID/X-Roles headers the API trusts.
  oathkeeper:
    image: oryd/oathkeeper:v26.2.0
    command: serve --config /etc/config/oathkeeper/oathkeeper.yml
    volumes:
      - ory-config:/etc/config:ro
    labels:
      - "traefik.http.middlewares.oathkeeper-auth.forwardauth.address=http://oathkeeper:4456/decisions"
      - "traefik.http.middlewares.oathkeeper-auth.forwardauth.authResponseHeaders=X-User,X-Email,X-DFSP-ID,X-Roles"
    depends_on:
      kratos:
        condition: service_healthy
      hydra:
        condition: service_healthy
      keto:
        condition: service_healthy
      prepare-ory-config:
        condition: service_completed_successfully
    restart: unless-stopped

  # Seeds the initial hub-admin (Kratos identity + Hub:mojaloop#admins Keto
  # tuple) so there is an account to log into the portal with.
  iam-bootstrap:
    image: alpine
    environment:
      - KRATOS_ADMIN_URL=http://kratos:4434
      - KETO_WRITE_URL=http://keto:4467
      - IAM_ADMIN_EMAIL=${IAM_ADMIN_EMAIL:-admin@mcm.local}
      - IAM_ADMIN_PASSWORD=${IAM_ADMIN_PASSWORD:-admin1234}
      - IAM_HUB_ADMIN_ROLE=${IAM_HUB_ADMIN_ROLE:-hub-admin}
      - KETO_HUB_OBJECT=${KETO_HUB_OBJECT:-mojaloop}
    volumes:
      - ./docker/ory/bootstrap-admin.sh:/bootstrap-admin.sh:ro
    entrypoint: ["/bin/sh", "-c", "apk add --no-cache curl jq >/dev/null && /bin/sh /bootstrap-admin.sh"]
    depends_on:
      kratos:
        condition: service_healthy
      keto:
        condition: service_healthy
    restart: "no"
