volumes:
  vault-data: {}
  hydra-sqlite: {}
  kratos-sqlite: {}
  keto-sqlite: {}

services:
  connection-manager-ui:
    # This builds the image from a locally cloned repo
    build:
      context: ../connection-manager-ui
      dockerfile: Dockerfile
      args:
        - AUTH_ENABLED=TRUE
        - REACT_APP_COMMIT=${REACT_APP_COMMIT:-unknown}
        - REACT_APP_VERSION=${REACT_APP_VERSION:-unknown}
    hostname: connection-manager-ui
    profiles:
      - dev
    environment:
      - AUTH_ENABLED=TRUE
      - API_BASE_URL=http://localhost:3001
      - LOGIN_URL=http://localhost:4433/self-service/login/browser
      - LOGOUT_URL=http://localhost:4433/self-service/logout/browser
      - CHECK_SESSION_URL=http://localhost:4433/sessions/whoami
    tty: true
    stdin_open: true
    ports:
      - "8081:8080"
    restart: always
    depends_on:
      connection-manager-api:
        condition: service_healthy

  connection-manager-migration:
    image: mojaloop/connection-manager-api:local
    pull_policy: if_not_present
    build:
      context: .
      dockerfile: Dockerfile
    profiles:
      - functional
    env_file: ./test/.env-func
    environment:
      - DATABASE_HOST=connection-manager-db
      - DATABASE_USER=${DBUSER:-mcm}
      - DATABASE_PASSWORD=${DBPASS:-mcm}
      - DATABASE_SCHEMA=${DBUSER:-mcm}
      - VAULT_ENDPOINT=http://vault-dev:8233
      - VAULT_ROLE_ID_FILE=/vault/file/role-id
      - VAULT_ROLE_SECRET_ID_FILE=/vault/file/secret-id
    volumes:
      - vault-data:/vault/file
      - ./docker/pki:/opt/app/docker/pki:ro
    depends_on:
      connection-manager-db:
        condition: service_healthy
      vault-dev:
        condition: service_healthy
    command: npm run migrate
    restart: "no"

  connection-manager-api:
    image: mojaloop/connection-manager-api:local
    pull_policy: if_not_present
    build:
      context: .
      dockerfile: Dockerfile
    profiles:
      - functional
    env_file: ./test/.env-func
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-moja123}
      - DATABASE_HOST=connection-manager-db
      - DATABASE_USER=${DBUSER:-mcm}
      - DATABASE_PASSWORD=${DBPASS:-mcm}
      - DATABASE_SCHEMA=${DBUSER:-mcm}
      - VAULT_ENDPOINT=http://vault-dev:8233
      - VAULT_ROLE_ID_FILE=/vault/file/role-id
      - VAULT_ROLE_SECRET_ID_FILE=/vault/file/secret-id
      - IAM_ENABLED=true
      - IAM_AUTO_CREATE_ACCOUNTS=true
      - HYDRA_ADMIN_URL=http://hydra:4445
      - HYDRA_PUBLIC_URL=http://hydra:4444
      - HYDRA_AUDIENCE=connection-manager-api
      - KRATOS_ADMIN_URL=http://kratos:4434
      - KRATOS_PUBLIC_URL=http://kratos:4433
      - KRATOS_IDENTITY_SCHEMA_ID=default
      - KETO_READ_URL=http://keto:4466
      - KETO_WRITE_URL=http://keto:4467
    volumes:
      - vault-data:/vault/file
      - ./docker/pki:/opt/app/docker/pki:ro
    tty: true
    stdin_open: true
    ports:
      - "3001:3001"
    restart: always
    depends_on:
      vault-dev:
        condition: service_healthy
      hydra:
        condition: service_started
      kratos:
        condition: service_started
      keto:
        condition: service_started
      connection-manager-migration:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:3001/api/health"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s

  connection-manager-db:
    image: mysql:9.7.0
    ports:
      - "3306:3306"
    volumes:
      - ./docker/sql-init/:/docker-entrypoint-initdb.d/
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-modus123}
      - MYSQL_USER=${DBUSER:-mcm}
      - MYSQL_PASSWORD=${DBPASS:-mcm}
      - MYSQL_DATABASE=${DBUSER:-mcm}
    healthcheck:
      test: ["CMD-SHELL", "mysql -h localhost -u$$MYSQL_USER -p$$MYSQL_PASSWORD -e 'SELECT 1'"]
      interval: 5s
      timeout: 3s
      retries: 20

  vault-dev:
    image: hashicorp/vault:2.0
    restart: always
    environment:
      VAULT_ADDR: http://127.0.0.1:8233
    ports:
      - "8233:8233"
    profiles:
      - functional
    volumes:
      - ./docker/vault/docker-entrypoint.sh:/usr/local/bin/docker-entrypoint.sh:ro
      - ./docker/vault/vault.hcl:/vault/config/vault.hcl:ro
      - vault-data:/vault/file
    tmpfs:
      - /run:mode=1777
    cap_add:
      - IPC_LOCK
    healthcheck:
      test: test -f /run/service_started
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  # Mailpit for email testing (SMTP + HTTP API)
  mailpit:
    image: axllent/mailpit:v1.30.1
    ports:
      - "1025:1025"
      - "8025:8025"
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:8025/api/v1/info"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # The hydra image runs as a non-root user and does not pre-create
  # /var/lib/sqlite, so the named-volume mount point lands root-owned. A tiny
  # busybox container makes it writable (canonical Ory quickstart pattern).
  hydra-sqlite-init:
    image: busybox
    command: chmod -R 777 /var/lib/sqlite
    volumes:
      - hydra-sqlite:/var/lib/sqlite
    restart: "no"

  hydra-migrate:
    image: oryd/hydra:v26.2.0
    environment:
      - DSN=sqlite:///var/lib/sqlite/db.sqlite?_fk=true&mode=rwc
    volumes:
      - hydra-sqlite:/var/lib/sqlite
      - ./docker/ory/hydra:/etc/config/hydra
    command: migrate sql --yes --config /etc/config/hydra/hydra.yml -e
    depends_on:
      hydra-sqlite-init:
        condition: service_completed_successfully
    restart: "no"

  hydra:
    image: oryd/hydra:v26.2.0
    environment:
      - DSN=sqlite:///var/lib/sqlite/db.sqlite?_fk=true&mode=rwc
    volumes:
      - hydra-sqlite:/var/lib/sqlite
      - ./docker/ory/hydra:/etc/config/hydra
    command: serve all --dev --config /etc/config/hydra/hydra.yml
    ports:
      - "4444:4444"
      - "4445:4445"
    depends_on:
      hydra-migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  kratos-migrate:
    image: oryd/kratos:v26.2.0
    environment:
      - DSN=sqlite:///var/lib/sqlite/db.sqlite?_fk=true&mode=rwc
    volumes:
      - kratos-sqlite:/var/lib/sqlite
      - ./docker/ory/kratos:/etc/config/kratos
    command: migrate sql --yes --config /etc/config/kratos/kratos.yml -e
    restart: "no"

  kratos:
    image: oryd/kratos:v26.2.0
    environment:
      - DSN=sqlite:///var/lib/sqlite/db.sqlite?_fk=true&mode=rwc
    volumes:
      - kratos-sqlite:/var/lib/sqlite
      - ./docker/ory/kratos:/etc/config/kratos
    command: serve all --dev --config /etc/config/kratos/kratos.yml
    ports:
      - "4433:4433"
      - "4434:4434"
    depends_on:
      kratos-migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_healthy
    restart: unless-stopped

  # The keto image does not pre-create /var/lib/sqlite with ory ownership,
  # so the named-volume mount-point gets created as root. Following the
  # canonical Ory quickstart pattern (see ory/hydra quickstart.yml), a tiny
  # busybox container chmods the volume up-front.
  keto-sqlite-init:
    image: busybox
    command: chmod -R 777 /var/lib/sqlite
    volumes:
      - keto-sqlite:/var/lib/sqlite
    restart: "no"

  keto-migrate:
    image: oryd/keto:v26.2.0
    environment:
      - DSN=sqlite:///var/lib/sqlite/db.sqlite?_fk=true&mode=rwc
    volumes:
      - keto-sqlite:/var/lib/sqlite
      - ./docker/ory/keto:/etc/config/keto
    command: migrate up -y --config /etc/config/keto/keto.yml
    depends_on:
      keto-sqlite-init:
        condition: service_completed_successfully
    restart: "no"

  keto:
    image: oryd/keto:v26.2.0
    environment:
      - DSN=sqlite:///var/lib/sqlite/db.sqlite?_fk=true&mode=rwc
    volumes:
      - keto-sqlite:/var/lib/sqlite
      - ./docker/ory/keto:/etc/config/keto
    command: serve --config /etc/config/keto/keto.yml
    ports:
      - "4466:4466"
      - "4467:4467"
    depends_on:
      keto-migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # Ory reference self-service UI (login, registration, recovery, settings, verification)
  kratos-ui:
    image: oryd/kratos-selfservice-ui-node:v26.2.0
    environment:
      - PORT=3000
      - KRATOS_PUBLIC_URL=http://kratos:4433
      - KRATOS_BROWSER_URL=http://localhost:4433
      - KRATOS_ADMIN_URL=http://kratos:4434
      - COOKIE_SECRET=changeme-please-changeme-please
      - CSRF_COOKIE_NAME=mcm_csrf_token
      - CSRF_COOKIE_SECRET=changeme-please-changeme-please
      - DANGEROUSLY_DISABLE_SECURE_CSRF_COOKIES=true
      - BASE_URL=http://localhost:4455/
    ports:
      - "4455:3000"
    depends_on:
      kratos:
        condition: service_started
    restart: unless-stopped
